yarnPath: .yarn/releases/yarn-4.18.0.cjs
nodeLinker: node-modules

# Yarn 4.14부터 의존성 install script가 기본 비활성이다. esbuild(tsx/vite)·
# @google/genai 등 기존(4.12) 설치 동작을 그대로 유지한다 — siglens와 같은 설정.
# 개별 allowlist(dependenciesMeta.built)로 좁히려면 클린 install로 동작을 실증한 뒤 바꿀 것.
enableScripts: true

# `npmMinimalAgeGate`(4.15부터 기본 1일)는 그대로 둔다 — 갓 배포된 서드파티 버전을
# quarantine하는 공급망 방어다. 4.18로 올리면 yarn이 `npmMinimalAgeGate: 0`을 써넣어
# 옛 동작을 보존하려 하는데, siglens와 같은 기본값을 유지하기 위해 지웠다.

npmScopes:
    y0ngha:
        npmRegistryServer: 'https://npm.pkg.github.com'
