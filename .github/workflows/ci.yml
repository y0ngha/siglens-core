name: CI

# 검사 목록은 이 파일 한 곳에만 둔다. 배포(publish.yml)는 이 워크플로를 workflow_call로
# 불러 같은 검사를 통과해야 publish한다 — 목록을 복사해 두면 한쪽만 고쳐져 갈라진다.
on:
    pull_request:
        types: [opened, synchronize, reopened]
    # PR이 각자 초록이어도 합쳐진 main은 검증되지 않는다. 머지 결과도 같은 CI를 탄다.
    push:
        branches: [main]
    workflow_call:

# PR은 같은 PR의 이전 실행을 취소한다. push(main)와 workflow_call(태그)은 ref 단위로 묶되
# 취소하지 않는다 — main에 연속 머지돼도 각 머지 결과의 검증 기록이 남아야 한다.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    ci:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Type check
              run: yarn typecheck

            - name: Lint
              run: yarn lint

            - name: Format check
              run: yarn format:check

            - name: Test
              run: yarn test

            # 배포 산출물은 publish.yml(v* 태그 push)에서야 처음 만들어졌다. 그래서
            # tsc-alias·tsconfig.build.json 쪽이 깨지면 릴리스 시점에 발견됐다.
            # PR에서 같은 빌드를 돌리고, 산출물을 소비자가 쓰는 방식으로 확인한다
            # (검사 내용은 scripts/verifyDist/verifyDist.ts. publish.yml도 같은 스크립트를 쓴다).
            - name: Build
              run: yarn build

            - name: Verify build output
              run: yarn verify:dist
