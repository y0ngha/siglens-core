name: CI

on:
    pull_request:
        types: [opened, synchronize, reopened]

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    ci:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Type check
              run: yarn typecheck

            - name: Lint
              run: yarn lint

            - name: Format check
              run: yarn format:check

            - name: Test
              run: yarn test

            # 배포 산출물은 publish.yml(v* 태그 push)에서야 처음 만들어졌다. 그래서
            # tsc-alias·tsconfig.build.json 쪽이 깨지면 릴리스 시점에 발견됐다.
            # PR에서 같은 빌드를 돌리고, 산출물을 소비자가 쓰는 방식으로 확인한다
            # (검사 내용은 scripts/verifyDist/verifyDist.ts. publish.yml도 같은 스크립트를 쓴다).
            - name: Build
              run: yarn build

            - name: Verify build output
              run: yarn verify:dist
