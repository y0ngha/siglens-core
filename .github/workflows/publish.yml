name: Publish

on:
    push:
        tags:
            - 'v*'

jobs:
    # 태그가 가리키는 커밋으로 PR CI와 같은 검사(typecheck·lint·format·test·build·verify:dist)를
    # 먼저 돌린다. release-it이 main에 바로 push하는 배포 커밋과, PR 여러 개가 합쳐진 main
    # 상태는 PR CI를 거치지 않기 때문이다.
    ci:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    publish:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  registry-url: https://npm.pkg.github.com
                  scope: '@y0ngha'
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build
              run: yarn build

            # 위 ci 잡이 같은 검증을 했지만, 여기서 publish하는 것은 이 잡이 새로 빌드한 dist다.
            # 올리는 산출물 자체를 확인한다.
            - name: Verify build output
              run: yarn verify:dist

            - name: Publish to GitHub Packages
              run: yarn npm publish
              env:
                  YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
