name: Publish

on:
    push:
        tags:
            - 'v*'

jobs:
    # 태그가 가리키는 커밋으로 PR CI와 같은 검사(typecheck·lint·format·test·build·verify:dist)를
    # 먼저 돌린다. release-it이 main에 바로 push하는 배포 커밋과, PR 여러 개가 합쳐진 main
    # 상태는 PR CI를 거치지 않기 때문이다. 이 단계는 태그·GitHub Release가 이미 만들어진 뒤라
    # 마지막 방어선이고, 첫 방어선은 release-it의 before:init 훅(.release-it.json)이다.
    ci:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read

    publish:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Enable Corepack
              run: corepack enable

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  registry-url: https://npm.pkg.github.com
                  scope: '@y0ngha'
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            # ci 잡이 typecheck·lint·format·test·build·verify:dist를 통과한 dist를 받는다.
            - name: Download verified dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist

            - name: Publish to GitHub Packages
              run: yarn npm publish
              env:
                  YARN_NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
